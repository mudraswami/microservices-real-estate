spring.application.name=api-gateway

server.port=8080

# =========================
# Eureka
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.eager-load.clients[0]=AUTH-SERVICE
spring.cloud.loadbalancer.eager-load.clients[1]=PROPERTY_SERVICE
spring.cloud.loadbalancer.eager-load.clients[2]=USER-SERVICE
spring.cloud.loadbalancer.eager-load.clients[3]=VISIT_SERVICE
spring.cloud.loadbalancer.eager-load.clients[4]=STATUS_SERVICE

# =========================
# Property Service
# =========================
spring.cloud.gateway.server.webmvc.routes[0].id=property-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PROPERTY_SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/properties,/properties/**

# =========================
# User Service
# =========================
spring.cloud.gateway.server.webmvc.routes[1].id=user-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users,/users/**

# =========================
# Visit Service
# =========================
spring.cloud.gateway.server.webmvc.routes[2].id=visit-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://VISIT_SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/visits,/visits/**

# =========================
# Status Service
# =========================
spring.cloud.gateway.server.webmvc.routes[3].id=status-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://STATUS_SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/status,/status/**

# =========================
# Auth Service
# =========================
spring.cloud.gateway.server.webmvc.routes[4].id=auth-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/auth/**